version: '3.8'

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: django_dev_db
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: ["/entrypoint.sh"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: django_dev_db
      DB_USER: dev_user
      DB_PASSWORD: dev_password123
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data:
