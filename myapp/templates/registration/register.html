{% extends 'base.html' %}

{% block title %}Registrar{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
	<div class="col-md-4 bg-light border p-4 rounded">
		<h4 class="mb-4 text-center mt-4">Criar uma conta</h4>
		<form method="post">
			{% csrf_token %}
			{{ form.as_p }}
			<button class="btn btn-warning w-100 mt-3" type="submit">Registrar</button>
		</form>
	</div>
</div>
{% endblock %}
